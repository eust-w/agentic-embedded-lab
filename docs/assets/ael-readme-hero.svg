<svg width="1600" height="720" viewBox="0 0 1600 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="0.52" stop-color="#0B1830"/>
      <stop offset="1" stop-color="#10162A"/>
    </linearGradient>
    <linearGradient id="accent" x1="380" y1="142" x2="1224" y2="589" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66E3FF"/>
      <stop offset="0.48" stop-color="#7C8CFF"/>
      <stop offset="1" stop-color="#B66CFF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#182943" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#101B30" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000817" flood-opacity="0.7"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#86A7D9" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="720" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="720" rx="24" fill="url(#grid)"/>
  <circle cx="207" cy="90" r="190" fill="#1BC8FF" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="1390" cy="650" r="250" fill="#A160FF" fill-opacity="0.09" filter="url(#glow)"/>

  <g opacity="0.9">
    <circle cx="86" cy="72" r="7" fill="#66E3FF"/>
    <circle cx="110" cy="72" r="7" fill="#7C8CFF"/>
    <circle cx="134" cy="72" r="7" fill="#B66CFF"/>
    <path d="M155 72H300" stroke="#7186A8" stroke-width="2" stroke-linecap="round"/>
    <text x="1290" y="78" fill="#8295B6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" letter-spacing="3">OPEN EMBEDDED LAB</text>
  </g>

  <text x="800" y="176" text-anchor="middle" fill="#F7FAFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="750" letter-spacing="-1.5">Agentic Embedded Lab</text>
  <text x="800" y="226" text-anchor="middle" fill="#9FB4D4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500" letter-spacing="0.5">A pluggable, evidence-driven virtual lab for embedded engineering agents</text>

  <g filter="url(#shadow)">
    <rect x="132" y="308" width="260" height="150" rx="20" fill="url(#panel)" stroke="#395274"/>
    <rect x="560" y="284" width="480" height="198" rx="24" fill="url(#panel)" stroke="url(#accent)" stroke-width="2"/>
    <rect x="1208" y="308" width="260" height="150" rx="20" fill="url(#panel)" stroke="#4E3F7E"/>

    <text x="262" y="350" text-anchor="middle" fill="#66E3FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">REASON</text>
    <text x="262" y="389" text-anchor="middle" fill="#F3F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Agent control plane</text>
    <text x="262" y="423" text-anchor="middle" fill="#91A7C8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Codex · Claude · MCP · CLI</text>

    <text x="800" y="329" text-anchor="middle" fill="#AABAF7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">EXPERIMENT</text>
    <text x="800" y="370" text-anchor="middle" fill="#F3F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="750">Continuous simulation loop</text>
    <text x="800" y="407" text-anchor="middle" fill="#9EB2D3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">route → run → observe → compare → replay</text>
    <rect x="726" y="433" width="148" height="28" rx="14" fill="#6F75FF" fill-opacity="0.19" stroke="#7C8CFF"/>
    <text x="800" y="453" text-anchor="middle" fill="#C7CEFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">FMI 2.0 + SSP</text>

    <text x="1338" y="350" text-anchor="middle" fill="#B66CFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">EVOLVE</text>
    <text x="1338" y="389" text-anchor="middle" fill="#F3F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Evidence-gated learning</text>
    <text x="1338" y="423" text-anchor="middle" fill="#A69AC8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">ground · validate · promote · rollback</text>
  </g>

  <path d="M392 383H540" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <path d="M522 371L540 383L522 395" stroke="#7C8CFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1060 383H1188" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <path d="M1170 371L1188 383L1170 395" stroke="#A070FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1338 478C1338 582 1180 603 800 603C420 603 262 582 262 478" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="8 10" stroke-linecap="round" opacity="0.75"/>
  <path d="M250 498L262 478L274 498" stroke="#66E3FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect x="358" y="532" width="884" height="56" rx="28" fill="#0C1527" fill-opacity="0.9" stroke="#2B4265"/>
    <text x="800" y="567" text-anchor="middle" fill="#CFDBEF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" letter-spacing="0.6">Everything is a plugin · Every run is evidence · Every promotion is gated</text>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650">
    <rect x="421" y="633" width="130" height="34" rx="17" fill="#163849" stroke="#256B82"/>
    <text x="486" y="655" text-anchor="middle" fill="#7CE7FF">RENODE</text>
    <rect x="563" y="633" width="130" height="34" rx="17" fill="#1E2D49" stroke="#415D88"/>
    <text x="628" y="655" text-anchor="middle" fill="#A8C8FF">NGSPICE</text>
    <rect x="705" y="633" width="190" height="34" rx="17" fill="#252B50" stroke="#535D9C"/>
    <text x="800" y="655" text-anchor="middle" fill="#BEC5FF">OPENMODELICA</text>
    <rect x="907" y="633" width="130" height="34" rx="17" fill="#30264D" stroke="#6B4F8E"/>
    <text x="972" y="655" text-anchor="middle" fill="#D8B8FF">NS-3</text>
    <rect x="1049" y="633" width="130" height="34" rx="17" fill="#382247" stroke="#81518D"/>
    <text x="1114" y="655" text-anchor="middle" fill="#E6B5F1">OPENEMS</text>
  </g>
</svg>
