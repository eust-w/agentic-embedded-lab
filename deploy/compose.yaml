services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ael
      POSTGRES_USER: ael
      POSTGRES_PASSWORD: development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ael"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ael-development
      MINIO_ROOT_PASSWORD: development-only-secret
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 ael-development development-only-secret;
        do sleep 1; done; mc mb --ignore-existing local/ael-development
  control-plane:
    build:
      context: ..
      dockerfile: containers/control-plane/Dockerfile
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ../:/workspace
    environment:
      AEL_DATABASE_URL: postgresql+psycopg://ael:development-only@postgres/ael
      AEL_S3_BUCKET: ael-development
      AEL_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ael-development
      AWS_SECRET_ACCESS_KEY: development-only-secret
      AEL_ALLOW_INSECURE_WORKER_TESTS: "1"
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:8765:8765"]
