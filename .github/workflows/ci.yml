name: foundation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: .
          toolchains: arm-zephyr-eabi
          sdk-version: 1.0.1
      - run: python -m pip install -e '.[dev,mcp,server,worker,modeling]'
      - run: ruff check src tests scripts
      - run: pytest --cov=ael --cov-report=term-missing --junitxml=foundation-tests.xml
      - name: Build FMI 2.0 proxies
        run: |
          cmake -S native/fmi-proxies -B .ael/build/fmi -DCMAKE_BUILD_TYPE=Release
          cmake --build .ael/build/fmi --parallel
          exports=(
            fmi2GetVersion fmi2GetTypesPlatform fmi2SetDebugLogging
            fmi2Instantiate fmi2FreeInstance fmi2SetupExperiment
            fmi2EnterInitializationMode fmi2ExitInitializationMode
            fmi2Terminate fmi2Reset fmi2GetReal fmi2SetReal
            fmi2GetInteger fmi2SetInteger fmi2GetBoolean fmi2SetBoolean
            fmi2GetString fmi2SetString fmi2GetFMUstate fmi2SetFMUstate
            fmi2FreeFMUstate fmi2SerializedFMUstateSize
            fmi2SerializeFMUstate fmi2DeSerializeFMUstate
            fmi2GetDirectionalDerivative fmi2SetRealInputDerivatives
            fmi2GetRealOutputDerivatives fmi2DoStep fmi2CancelStep
            fmi2GetStatus fmi2GetRealStatus fmi2GetIntegerStatus
            fmi2GetBooleanStatus fmi2GetStringStatus
          )
          for proxy in RenodeFmu NgspiceFmu ModelicaFmu Ns3Fmu OpenEmsFmu; do
            for symbol in "${exports[@]}"; do
              nm -D ".ael/build/fmi/${proxy}.so" | grep -F " ${symbol}"
            done
          done
      - run: ael schema export schemas/v1
      - run: git diff --exit-code -- schemas/v1
      - run: ael validate examples/experiments/synthetic-smoke.yaml
      - run: ael run examples/experiments/synthetic-smoke.yaml
      - name: Run real build-mechanism benchmark subset
        run: |
          if ! ael benchmark run --case-id 1 --case-id 2 --case-id 3 \
            --source-revision "$GITHUB_SHA"; then
            for evidence in acceptance/evidence/0{1,2,3}-*.json; do
              echo "=== ${evidence} ==="
              cat "${evidence}"
            done
            exit 1
          fi
      - run: ael release check --profile foundation
      - name: Production gate must remain blocked without a Lab
        run: |
          if ael release check --profile production >production-gate.json; then
            echo "production gate unexpectedly passed" >&2
            exit 1
          fi
          grep -F "five reference platforms" production-gate.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: foundation-evidence
          path: |
            acceptance/
            runs/
            production-gate.json
          retention-days: 14
