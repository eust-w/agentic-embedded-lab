name: foundation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "codex/aether-go-desktop-parity"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-foundation:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.1"
          cache: true
      - run: go mod download
      - run: go fmt ./...
      - name: Formatting must be committed
        run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./cmd/schema-export --output schemas/v2
      - name: Schemas must be committed
        run: git diff --exit-code -- schemas/v2
      - name: Build Go entrypoints
        env:
          CGO_LDFLAGS: -framework UniformTypeIdentifiers
        run: |
          go build -trimpath -tags desktop,production -o /tmp/aether-desktop ./cmd/aether-desktop
          go build -trimpath -o /tmp/aetherd ./cmd/aetherd
          CGO_ENABLED=0 go build -trimpath -o /tmp/ael-backend ./cmd/ael-backend

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Embedded frontend assets must be committed
        run: git diff --exit-code -- internal/webassets/dist

  publication-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Reject tracked secrets and runtime state
        run: |
          ! git grep -I -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}'
          ! git ls-files | grep -E '(^|/)(node_modules|\.aether|\.ael|runs)(/|$)'
