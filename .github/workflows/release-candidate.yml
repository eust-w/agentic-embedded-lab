name: release-candidate-software-gates

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: ["codex/ael-full-platform"]
  workflow_dispatch:

jobs:
  server-worker-security:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: ael
          POSTGRES_USER: ael
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ael"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[dev,mcp,server,worker,modeling]'
      - name: Start S3-compatible evidence store
        run: |
          docker run -d --name ael-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=test-only \
            -e MINIO_ROOT_PASSWORD=test-only-secret \
            quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh \
            quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z \
            -c 'mc alias set local http://127.0.0.1:9000 test-only test-only-secret && mc mb local/ael-test'
      - run: pytest tests/test_worker.py tests/test_server_storage.py tests/test_security.py tests/test_api.py
      - name: PostgreSQL/S3 semantic experiment
        env:
          AEL_DATABASE_URL: postgresql+psycopg://ael:test-only@127.0.0.1:5432/ael
          AEL_S3_BUCKET: ael-test
          AEL_S3_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: test-only
          AWS_SECRET_ACCESS_KEY: test-only-secret
        run: ael run examples/experiments/synthetic-smoke.yaml
      - name: Validate compose and Helm rendering
        run: |
          docker compose -f deploy/compose.yaml config >/dev/null
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint deploy/helm/ael
          helm template ael deploy/helm/ael >/tmp/ael-manifests.yaml
      - name: Generate CycloneDX SBOM
        env:
          SYFT_VERSION: 1.42.3
        run: |
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 600 "${base}/${archive}" -o "/tmp/${archive}"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 600 \
            "${base}/syft_${SYFT_VERSION}_checksums.txt" -o /tmp/syft-checksums.txt
          (cd /tmp && grep -F " ${archive}" syft-checksums.txt | sha256sum --check -)
          tar -xzf "/tmp/${archive}" -C /tmp syft
          /tmp/syft scan dir:. --output cyclonedx-json=ael-sbom.cdx.json
      - name: Generate Python license inventory
        run: |
          python -m pip install pip-licenses
          pip-licenses --format=json --with-urls --with-license-file \
            >python-licenses.json
      - uses: sigstore/cosign-installer@v3
      - name: Keyless sign and verify the SBOM
        run: |
          cosign sign-blob --yes --bundle ael-sbom.sigstore.json ael-sbom.cdx.json
          cosign verify-blob \
            --bundle ael-sbom.sigstore.json \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-candidate.yml@refs/heads/.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ael-sbom.cdx.json
      - name: Verify production remains blocked
        run: |
          if ael release check --profile production >production-gate.json; then
            exit 1
          fi
          grep -F "instrument calibration" production-gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-software-evidence
          path: |
            ael-sbom.cdx.json
            ael-sbom.sigstore.json
            python-licenses.json
            production-gate.json
            /tmp/ael-manifests.yaml
          retention-days: 30
