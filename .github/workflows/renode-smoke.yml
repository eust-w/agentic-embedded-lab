name: renode-go-worker-smoke

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "cmd/ael-backend/**"
      - "internal/ael/**"
      - "containers/renode/**"
      - ".github/workflows/renode-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build pinned Renode image with Go worker
        run: |
          docker buildx build \
            --file containers/renode/Dockerfile \
            --tag ael-renode:ci \
            --cache-from type=gha,scope=renode-go \
            --cache-to type=gha,mode=max,scope=renode-go \
            --load .
      - name: Probe backend protocol and pinned tool
        run: |
          request='{"api_version":"ael.backend/v2","id":"probe","operation":"probe","payload":{}}'
          response=$(printf '%s\n' "$request" | docker run --rm -i ael-renode:ci)
          printf '%s\n' "$response" | tee renode-probe.json
          jq -e '.ok == true and .id == "probe" and .outputs.available == 1' renode-probe.json
          docker run --rm --entrypoint renode ael-renode:ci --version | grep -F 1.16.1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: renode-go-worker-smoke
          path: renode-probe.json
          if-no-files-found: ignore
