name: backend-images

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "containers/**"
      - "src/ael/backend_workers/**"
      - ".github/workflows/backend-images.yml"

jobs:
  build-and-probe:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [renode, ngspice, openmodelica, ns3, openems]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/${{ matrix.backend }}/Dockerfile
          tags: ael-${{ matrix.backend }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.backend }}
          cache-to: type=gha,mode=max,scope=${{ matrix.backend }}
      - name: Probe pinned tool through process protocol
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          request='{"api_version":"ael.dev/backend/v1","request_id":"probe","operation":"probe","payload":{}}'
          response=$(printf '%s\n' "$request" | docker run --rm -i "ael-${BACKEND}:ci")
          printf '%s\n' "$response" | tee "${BACKEND}-probe.json"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] and d["outputs"]["available"]' <<<"$response"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.backend }}-probe
          path: ${{ matrix.backend }}-probe.json
