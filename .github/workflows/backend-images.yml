name: backend-images

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["codex/ael-0.2-real-mechanisms"]
    paths:
      - "containers/**"
      - "src/ael/backend_workers/**"
      - "benchmarks/models/**"
      - ".github/workflows/backend-images.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "containers/**"
      - "src/ael/backend_workers/**"
      - ".github/workflows/backend-images.yml"

jobs:
  build-and-probe:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [renode, ngspice, openmodelica, ns3, openems]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/${{ matrix.backend }}/Dockerfile
          tags: ael-${{ matrix.backend }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.backend }}
          cache-to: type=gha,mode=max,scope=${{ matrix.backend }}
      - name: Probe pinned tool through process protocol
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          request='{"api_version":"ael.dev/backend/v1","request_id":"probe","operation":"probe","payload":{}}'
          response=$(printf '%s\n' "$request" | docker run --rm -i "ael-${BACKEND}:ci")
          printf '%s\n' "$response" | tee "${BACKEND}-probe.json"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] and d["outputs"]["available"]' <<<"$response"
          if [ "$BACKEND" = ns3 ]; then
            output=$(docker run --rm --entrypoint /opt/ael-bin/ael-network ael-ns3:ci \
              --stopUs=1000 --protocol=0 --interference_dbm=-95 \
              --partition_ms=0 --retry_limit=8)
            printf '%s\n' "$output" | tee ns3-runtime-smoke.log
            grep -F "AEL_METRIC failure=0" <<<"$output"
          fi
          if [ "$BACKEND" = openmodelica ]; then
            mkdir -p .ael/backend-runtime
            cat > openmodelica-requests.jsonl <<'EOF'
          {"api_version":"ael.dev/backend/v1","request_id":"prepare","operation":"prepare","payload":{"component":{"id":"plant","type":"thermal-battery-functional-model","backend":"openmodelica","model":"benchmarks/models/modelica/domain.mos","step_us":1000,"ports":[],"properties":{}},"seed":1020}}
          {"api_version":"ael.dev/backend/v1","request_id":"r","operation":"inject","virtual_time_us":0,"payload":{"target":"plant.thermal_resistance_K_per_W","value":18.0}}
          {"api_version":"ael.dev/backend/v1","request_id":"s","operation":"inject","virtual_time_us":0,"payload":{"target":"plant.sleep_current_A","value":0.000008}}
          {"api_version":"ael.dev/backend/v1","request_id":"d","operation":"inject","virtual_time_us":0,"payload":{"target":"plant.duty_cycle","value":0.01}}
          {"api_version":"ael.dev/backend/v1","request_id":"p","operation":"inject","virtual_time_us":0,"payload":{"target":"plant.input_power","value":0.18}}
          {"api_version":"ael.dev/backend/v1","request_id":"retry","operation":"inject","virtual_time_us":0,"payload":{"target":"plant.rf_retries","value":0}}
          {"api_version":"ael.dev/backend/v1","request_id":"step","operation":"step","virtual_time_us":0,"payload":{"step_us":1000}}
          EOF
            docker run --rm -i -v "$PWD:/workspace" ael-openmodelica:ci \
              < openmodelica-requests.jsonl | tee openmodelica-runtime-smoke.jsonl
            python - <<'PY'
          import json
          from pathlib import Path

          responses = [json.loads(line) for line in Path("openmodelica-runtime-smoke.jsonl").read_text().splitlines()]
          step = next(item for item in responses if item["request_id"] == "step")
          assert step["ok"], step
          assert step["metrics"]["failure"] == 0.0, step
          assert 28.0 < step["metrics"]["temperature"] < 29.0, step
          assert step["metrics"]["battery_hours"] > 5000.0, step
          PY
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.backend }}-probe
          path: |
            ${{ matrix.backend }}-probe.json
            ${{ matrix.backend }}-runtime-smoke.log
            ${{ matrix.backend }}-runtime-smoke.jsonl
          if-no-files-found: ignore
