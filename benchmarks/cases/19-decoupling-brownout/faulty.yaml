- at_us: 0
  target: circuit.capacitance_uF
  value: 2.2
  unit: uF
- at_us: 0
  target: circuit.load_microamp
  value: 160000.0
  unit: uA
- at_us: 0
  target: circuit.rf_retries
  value: 0.0
assertions:
- metric: circuit.failure
  operator: eq
  expected: 0
  critical: true
observables:
- circuit.failure
allowed_model_states:
- conformance_validated
- hardware_validated
- production_approved
tags:
- benchmark
- mechanism-backed
- faulty
- case-19
