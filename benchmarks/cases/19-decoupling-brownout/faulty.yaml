api_version: ael.dev/v1
kind: ExperimentSpec
name: 19-decoupling-brownout-faulty
system: benchmarks/systems/power-renode-faulty.yaml
duration_us: 6000
macro_step_us: 1000
timeout_s: 300
seed: 1019
stimuli:
- at_us: 0
  target: mcu.case_id
  value: 19
- at_us: 0
  target: circuit.source_resistance_ohm
  value: 12.0
