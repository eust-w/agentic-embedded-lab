api_version: ael.dev/v2
id: modelica-sensor-extension
components:
  - id: sensor
    backend: openmodelica
    model: benchmarks/models/modelica/sensor_error.mos
    step_us: 1000
    rollback: false
    event_driven: false
    ports:
      - {name: true_value, direction: input, type: real, unit: "1"}
      - {name: bias, direction: input, type: real, unit: "1"}
      - {name: time_constant_s, direction: input, type: real, unit: "s"}
      - {name: max_error, direction: input, type: real, unit: "1"}
      - {name: error, direction: output, type: real, unit: "1"}
      - {name: failure, direction: output, type: real, unit: "1"}
    properties: {}
    fidelity: {firmware: unsupported, register: unsupported, protocol: functional, timing: functional, physical: unsupported, hardware_validated: false, limitations: ["Deterministic bias/dynamics model; no calibrated stochastic noise."]}
connections: []
