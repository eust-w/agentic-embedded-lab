api_version: ael.dev/v1
kind: ExperimentSpec
name: riscv-hifive1-fixed-smoke
system: benchmarks/systems/renode-riscv-smoke.yaml
duration_us: 3000
macro_step_us: 1000
timeout_s: 300
seed: 404
stimuli:
  - {at_us: 0, target: mcu.case_id, value: 4}
  - {at_us: 0, target: mcu.fixed, value: 1}
assertions:
  - {metric: mcu.failure, operator: eq, expected: 0, critical: true}
allowed_model_states: [conformance_validated, hardware_validated, production_approved]
tags: [riscv, zephyr, smoke]
