api_version: ael.dev/v1
kind: SystemManifest
name: renode-zephyr-dual-architecture-reference
components:
  - id: mcu
    type: stm32f4-zephyr-reference
    backend: renode
    model: benchmarks/models/renode/stm32f4-ael.repl
    step_us: 1000
    ports:
      - {name: case_id, direction: input, data_type: integer}
      - {name: network_retries, direction: input, data_type: real, unit: "1"}
      - {name: failure, direction: output, data_type: integer}
      - {name: retries, direction: output, data_type: real, unit: "1"}
      - {name: current, direction: output, data_type: real, unit: uA}
    properties:
      firmware: firmware/zephyr/build-stm32-fixed/zephyr/zephyr.elf
      model_state: conformance_validated
      input_registers: {case_id: 0x2001fc00, network_retries: 0x2001fc14}
      output_registers: {failure: 0x2001fc08, retries: 0x2001fc0c, current: 0x2001fc10}
      output_sentinels: {failure: 0xffffffff}
fidelity:
  firmware_cpu: functional
  register: functional-bridge
  timing: virtual-functional
  electrical: unverified
  hardware: unverified
