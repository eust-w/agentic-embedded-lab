api_version: ael.dev/v1
kind: SystemManifest
name: native-build-analysis
components:
  - id: analysis
    type: declarative-build-analysis
    backend: native
    model: benchmarks/models/native/build-analysis.json
    step_us: 1000
    ports:
      - {name: case_id, direction: input, data_type: integer}
      - {name: fixed, direction: input, data_type: boolean}
      - {name: failure, direction: output, data_type: integer}
      - {name: diagnostic, direction: output, data_type: string}
fidelity:
  build: host-analysis
  hardware: unverified
