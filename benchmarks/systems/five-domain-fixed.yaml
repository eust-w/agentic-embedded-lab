api_version: ael.dev/v1
kind: SystemManifest
name: antenna-retry-power-thermal-five-domain-fixed
description: Functional cross-domain chain; no calibrated hardware equivalence.
components:
- id: antenna
  type: printed-monopole-functional-geometry
  backend: openems
  model: benchmarks/models/openems/antenna_detuning.m
  event_driven: true
  ports:
  - name: detune
    direction: input
    data_type: real
    unit: mm
  - name: rf_loss_db
    direction: output
    data_type: real
    unit: dB
  - name: failure
    direction: output
    data_type: real
    unit: '1'
- id: network
  type: deterministic-network-scenario
  backend: ns3
  model: benchmarks/models/ns3/ael-network.cc
  step_us: 1000
  ports:
  - name: rf_loss_db
    direction: input
    data_type: real
    unit: dB
  - name: interference_dbm
    direction: input
    data_type: real
    unit: dBm
  - name: partition_ms
    direction: input
    data_type: real
    unit: ms
  - name: retry_limit
    direction: input
    data_type: integer
    unit: '1'
  - name: protocol
    direction: input
    data_type: integer
    unit: '1'
  - name: retries
    direction: output
    data_type: real
    unit: '1'
  - name: failure
    direction: output
    data_type: real
    unit: '1'
  properties:
    program: scratch/ael-network
- id: mcu
  type: stm32f4-zephyr-reference
  backend: renode
  model: benchmarks/models/renode/stm32f4-ael.repl
  step_us: 1000
  ports:
  - name: case_id
    direction: input
    data_type: integer
  - name: network_retries
    direction: input
    data_type: real
    unit: '1'
  - name: retries
    direction: output
    data_type: real
    unit: '1'
  - name: current
    direction: output
    data_type: real
    unit: uA
  - name: failure
    direction: output
    data_type: integer
  properties:
    firmware: firmware/zephyr/build-stm32-fixed/zephyr/zephyr.elf
    model_state: conformance_validated
    input_registers:
      case_id: 537000960
      network_retries: 537000980
    output_registers:
      failure: 537000968
      retries: 537000972
      current: 537000976
    output_sentinels:
      failure: 4294967295
    output_scales:
      retries: 0.001
- id: circuit
  type: transient-power-path
  backend: ngspice
  model: benchmarks/models/ngspice/power_path.cir
  step_us: 1000
  ports:
  - name: load_microamp
    direction: input
    data_type: real
    unit: uA
  - name: rf_retries
    direction: input
    data_type: real
    unit: '1'
  - name: source_resistance_ohm
    direction: input
    data_type: real
    unit: Ohm
  - name: capacitance_uF
    direction: input
    data_type: real
    unit: uF
  - name: power
    direction: output
    data_type: real
    unit: W
  - name: failure
    direction: output
    data_type: real
    unit: '1'
- id: plant
  type: thermal-battery-functional-model
  backend: openmodelica
  model: benchmarks/models/modelica/domain.mos
  step_us: 1000
  ports:
  - name: input_power
    direction: input
    data_type: real
    unit: W
  - name: rf_retries
    direction: input
    data_type: real
    unit: '1'
  - name: thermal_resistance_K_per_W
    direction: input
    data_type: real
    unit: K/W
  - name: sleep_current_A
    direction: input
    data_type: real
    unit: A
  - name: duty_cycle
    direction: input
    data_type: real
    unit: '1'
  - name: temperature
    direction: output
    data_type: real
    unit: Cel
  - name: failure
    direction: output
    data_type: real
    unit: '1'
connections:
- source: antenna.rf_loss_db
  target: network.rf_loss_db
  unit: dB
- source: network.retries
  target: mcu.network_retries
  unit: '1'
- source: mcu.current
  target: circuit.load_microamp
  unit: uA
- source: mcu.retries
  target: circuit.rf_retries
  unit: '1'
- source: mcu.retries
  target: plant.rf_retries
  unit: '1'
- source: circuit.power
  target: plant.input_power
  unit: W
fidelity:
  digital: functional
  circuit: functional-component-model
  thermal: functional-lumped
  network: functional-scenario
  electromagnetic: functional-geometry
  hardware: unverified
