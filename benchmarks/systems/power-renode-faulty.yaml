api_version: ael.dev/v1
kind: SystemManifest
name: firmware-power-cross-domain-faulty
components:
- id: mcu
  type: stm32f4-zephyr-reference
  backend: renode
  model: benchmarks/models/renode/stm32f4-ael.repl
  step_us: 1000
  ports:
  - name: case_id
    direction: input
    data_type: integer
  - name: current
    direction: output
    data_type: real
    unit: uA
  - name: failure
    direction: output
    data_type: integer
  properties:
    firmware: firmware/zephyr/build-stm32-faulty/zephyr/zephyr.elf
    model_state: conformance_validated
    input_registers:
      case_id: 537000960
    output_registers:
      failure: 537000968
      current: 537000976
    output_sentinels:
      failure: 4294967295
- id: circuit
  type: transient-power-path
  backend: ngspice
  model: benchmarks/models/ngspice/power_path.cir
  step_us: 1000
  ports:
  - name: load_microamp
    direction: input
    data_type: real
    unit: uA
  - name: source_resistance_ohm
    direction: input
    data_type: real
    unit: Ohm
  - name: capacitance_uF
    direction: input
    data_type: real
    unit: uF
  - name: rf_retries
    direction: input
    data_type: real
    unit: '1'
  - name: failure
    direction: output
    data_type: real
    unit: '1'
  - name: supply_voltage
    direction: output
    data_type: real
    unit: V
connections:
- source: mcu.current
  target: circuit.load_microamp
  unit: uA
fidelity:
  digital: functional
  circuit: functional-component-model
  pcb_parasitics: unverified
  hardware: unverified
